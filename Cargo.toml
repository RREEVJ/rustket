[package]
name = "rustket"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "http2", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
